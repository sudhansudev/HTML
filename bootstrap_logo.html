<!-- Bootstrap download logo-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button-row
        {
            display : felx;
            align-items :center;
            gap : 100px;
        }
        .boot-button
        {
            background-color : rgb(121,82,179);
            color: white;
            border-radius : 4px;
            height : 40px;
            width : 120px;
            border : none;
            font-size : 17px;
            
        }

        .boot-download
        {
            background-color : white;
            color : rgb(121,82,179);
            border-color : rgb(108,117,125);
            height : 40px;
            width : 120px;
            border-radius : 4px;
            margin-left: 2px;
            font-size : 17px;
        }


    </style>
 </head>
 <body>
    <div class="button-row">
    <button class="boot-button">Get started </button>
    <button class="boot-download"> Download </button> 
    </div>
</body>
 </html>
