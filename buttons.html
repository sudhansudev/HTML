<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
  .sub
  {
    background-color : rgb(198, 30, 30) ;
    color : white;
    border-color : red;
    height : 35px;
    width : 120px;
    border-radius : 3px;
    border : none;
    cursor : pointer;
  }

  .join
  {
    background-color : rgb(255, 255, 255) ;
    color : blue;
    border-color : blue;
    height : 35px;
    width : 80px;
    border-radius : 3px;
    border-width: 2px;
    border-style :solid;
    cursor : pointer;
    margin-left : 8px;
  }

  .tweet
  {
    border-radius :17px;
    height : 35px;
    width : 95px;
    background-color : rgb(0, 149, 255);
    color : white;
    cursor : pointer;
    border-color :rgb(0, 149, 255);
    font-weight : bold;
    font-size : 15px;
    margin-left : 8px;
    border : none;
  }
</style>

<button class ="sub">SUBSCRIBE</button>
<button class = "join">JOIN</button>
<button class = "tweet">Tweet</button>
</body>
</html>
