<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cart-button
        {
            background-color : rgb(255, 196, 1);
            font-size : 17px;
            height : 40px;
            width : 230px;
            border-radius : 20px;
            border: none;
            cursor : pointer;
            transition : background-color 0.2s;
        }
        .cart-button:hover
        {
            background-color : rgba(237, 178, 1, 0.847);
        }
    </style>
</head>
<body>
    <button class="cart-button">Add to cart </button>
</body>
</html>
