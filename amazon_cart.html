<!-- Amazon cart design -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cart-button
        {
            background-color :rgb(255,216,20);
            cursor : pointer;
            border-radius : 17px;
            height : 35px;
            width : 130px;
            font-size : 15px;
            border-color:rgb(255,216,20);
        }
        .buy-button
        {
            font-size : 15px;
            height : 35px;
            width : 100px;
            background-color :rgb(255,164,28);
            margin-left : 14px;
            border-radius : 17px;
            border-color :rgb(255,164,28);
        }
        .para
        {
            color : rgb(0,118,0);
            font-weight : bold;
            font-size : 20px;
        }

    </style>
 </head>
 <body>
    <a href="https://www.amazon.com/" target="_blank">Back to Amazon</a>

    <h2> Nike Black Running Shoes </h2>
    <p class="para"> $39 - in stock. </p>
    <p>Free delivery tomorrow .</p>
    <button class="cart-button">Add to Cart </button>
    <button class="buy-button">Buy Now </button>
 </body>
 </html>
