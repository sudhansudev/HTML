<!-- shadow , transitions and other effects -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sub-button
        {
            background-color : rgba(181, 2, 2, 0.915);
            height : 40px;
            width : 130px;
            border-radius : 5px;
            border : none;
            color : white;
            font-size : 14px;
            cursor : pointer;
            transition : opacity 0.15s;
        }
        .sub-button:hover
        {

            opacity : 0.8;
        }
        .sub-button:active
        {
            background-color : blue;
        }
        .join-button:hover  
        {
            color : white;
            background-color : rgba(0, 81, 255,0.9);
            
        }
        .join-button:active
        {
            opacity : 0.7;
        }
        .join-button
        {
            font-size : 14px;
            height : 40px;
            width : 70px;
            border-radius : 3px;
            border-color : rgba(0, 94, 255, 0.923);
            border-width : 2px;
            color : rgb(0, 42, 255);
            background-color : white;
            margin-left : 8px;
            cursor : pointer;
            transition : background-color 0.2s,
                         color 0.3s;
        }
        .tweet-button
        {
            font-size : 14px;
            height : 40px;
            width : 80px;
            margin-left : 8px;
            border-radius : 20px;
            border-width : 2px;
            background-color : rgb(4, 131, 204);
            color : white;
            border : none;
            cursor : pointer;
            transition : box-shadow 0.15s;
        }
        .tweet-button:hover
        {
            box-shadow : 3px 2px 7px rgba(0, 0, 0, 0.4);
        }
    </style>
 </head>
 <body>
    <button class="sub-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
 </body>
 </html>
