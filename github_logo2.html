<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sign 
        {
            background-color : #096acc ;
            color : white;
            font-size : 17px;
            padding-left : 14px;
            padding-right : 14px;
            padding-top : 12px;
            padding-bottom : 12px;
            border : none;
            border-radius : 14px;
            font-family : Verdana, Geneva, Tahoma, sans-serif;
            cursor : pointer;
            transition : box-shadow 0.2s;
            margin-left : 280px;
            vertical-align : top;
        }   
        .sign:hover
        {
            box-shadow : 2px 2px 10px rgba(0,0,0,0.4);
        }
        .log-in
        {
            vertical-align : top;
            padding-left : 14px;
            padding-right : 14px;
            padding-top : 12px;
            padding-bottom : 12px;
            margin-left : 20px;
            margin-right : 20px;
            background-color : #60435F;
            color : white;
            border-radius : 14px;
            border: none;
            cursor : pointer;
            font-size : 17px;
            transition : box-shadow 0.2s;
            text-align: center;
        }
        .log-in:hover
        {
            box-shadow : 2px 2px 10px rgba(0,0,0,0.4);
            margin : 20px; 
            padding-left : 30px;
            padding-right : 30px;
            
            
            
        }
        
    </style>
</head>
<body>
    <button class="sign">Sign up </button>
    <button class="log-in">Log-in</button>
</body>
</html>
